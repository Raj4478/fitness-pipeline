name: Original Devotional Reel Worker

on:
  workflow_dispatch:
    inputs:
      mood:
        description: 'Mood preset'
        required: true
        type: string
      topic:
        description: 'Original Reel topic'
        required: true
        type: string
      chat_id:
        description: 'Telegram chat ID for delivery'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: original-devotional-reel-${{ inputs.chat_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORIGINAL_REEL_MOOD: ${{ inputs.mood }}
      ORIGINAL_REEL_TOPIC: ${{ inputs.topic }}
      ORIGINAL_REEL_CHAT_ID: ${{ inputs.chat_id }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_REEL_MODEL: 'openai/gpt-oss-20b'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_IMAGE_MODEL_PREMIUM: '@cf/black-forest-labs/flux-2-klein-9b'
      CLOUDFLARE_IMAGE_MODEL_FAST: '@cf/black-forest-labs/flux-2-klein-4b'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Reel runtime
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --disable-pip-version-check -U requests pillow
      - name: Validate generator
        run: python -m py_compile youtube-telegram-bot/scripts/create_original_reel.py
      - name: Generate and return original Reel
        run: python youtube-telegram-bot/scripts/create_original_reel.py
