name: yt-dlp Final Integration CI Once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ytdlp_final_ci_once.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - name: Install yt-dlp worker dependencies
        run: python -m pip install --disable-pip-version-check -U --pre "yt-dlp[default]" requests
      - name: Validate worker runtime
        run: |
          python -m py_compile scripts/download_youtube.py
          python -c "import yt_dlp, requests; print('yt-dlp runtime OK')"
