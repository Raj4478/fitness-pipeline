name: Daily FitFacts Video Generator

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to generate (leave empty for auto)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core \
            fonts-noto-core fonts-noto-extra \
            fonts-noto-hinted fonts-lohit-deva

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required folders
        run: mkdir -p logs tmp/videos tmp/audio tmp/shorts assets music data

      - name: Copy logo to assets
        run: |
          if [ -f "assets/logo.png" ]; then
            echo "Logo found"
          else
            echo "No logo found — skipping"
          fi

      - name: Notify Telegram — starting
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
        run: |
          python3 -c "
          import urllib.request, json, os
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          topic = '${{ github.event.inputs.topic }}' or 'auto'
          msg = f'⏳ FitFacts pipeline started\nTopic: {topic}\nTime: $(TZ=Asia/Kolkata date "+%d %b %Y %I:%M %p IST")'
          url = f'https://api.telegram.org/bot{token}/sendMessage'
          data = json.dumps({'chat_id': chat_id, 'text': msg}).encode()
          req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})
          urllib.request.urlopen(req)
          print('Telegram notified')
          "

      - name: Generate video
        id: generate
        env:
          LLM_PROVIDER: gemini
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: eleven_flash_v2_5
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNELS: ${{ secrets.BUFFER_CHANNELS }}
          GH_UPLOAD_TOKEN: ${{ secrets.GH_UPLOAD_TOKEN }}
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -n "$TOPIC" ]; then
            python -m src.pipeline --niche fitness --topic "$TOPIC"
          else
            python -m src.pipeline --niche fitness
          fi

      - name: Send video to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/send_to_telegram.py

      - name: Repurpose for YouTube Shorts
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
        run: python scripts/repurpose_for_shorts.py

      - name: Generate thumbnail
        if: success()
        run: |
          pip install Pillow -q
          export VIDEO_PATH=$(ls tmp/videos/*.mp4 2>/dev/null | grep -v "13sec\|short" | head -1)
          export VIDEO_HOOK=$(grep "hook=" logs/pipeline_*.log 2>/dev/null | tail -1 | sed 's/.*hook=//' | cut -c1-80)
          export VIDEO_TOPIC=$(grep "Topic selected:" logs/pipeline_*.log 2>/dev/null | tail -1 | awk '{print $NF}')
          if [ -n "$VIDEO_PATH" ]; then
            python scripts/generate_thumbnail.py && echo "Thumbnail OK" || echo "Thumbnail failed (non-critical)"
          fi

      - name: Upload to YouTube Shorts
        id: youtube_upload
        if: success()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
        run: python scripts/upload_to_youtube.py

      - name: Post pinned comment
        if: success() && steps.youtube_upload.outputs.youtube_video_id != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_VIDEO_ID: ${{ steps.youtube_upload.outputs.youtube_video_id }}
          VIDEO_TOPIC: ${{ env.VIDEO_TOPIC }}
        run: |
          export VIDEO_TOPIC=$(grep "Topic selected:" logs/pipeline_*.log 2>/dev/null | tail -1 | awk '{print $NF}')
          python scripts/post_pinned_comment.py || echo "Pinned comment failed (non-critical)"

      - name: Print error summary on failure
        if: failure()
        run: |
          echo "=========================================="
          echo "PIPELINE FAILURE SUMMARY"
          echo "=========================================="
          echo "Run ID: ${{ github.run_id }}"
          echo "Run #:  ${{ github.run_number }}"
          echo "Time:   $(TZ=Asia/Kolkata date "+%d %b %Y %I:%M %p IST")"
          echo "------------------------------------------"
          echo "Last 50 lines of pipeline log:"
          cat logs/pipeline_*.log 2>/dev/null | tail -50 || echo "No log file found"
          echo "=========================================="

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 -c "
          import urllib.request, json, os
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          run_id = os.environ['GITHUB_RUN_ID']
          msg = f'❌ Pipeline failed!\nCheck logs: https://github.com/Raj4478/fitness-pipeline/actions/runs/{run_id}'
          url = f'https://api.telegram.org/bot{token}/sendMessage'
          data = json.dumps({'chat_id': chat_id, 'text': msg}).encode()
          req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})
          urllib.request.urlopen(req)
          "

      - name: Upload videos as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitfacts-videos-${{ github.run_number }}
          path: |
            tmp/videos/*.mp4
            tmp/shorts/*.mp4
          retention-days: 7

      - name: Keep repo active
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          echo "Last run: $(TZ=Asia/Kolkata date "+%d %b %Y %I:%M %p IST")" > .last_run
          git add .last_run
          git diff --staged --quiet || git commit -m "chore: keep workflow active [skip ci]"
          git push || true

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_number }}
          path: logs/
          retention-days: 3
