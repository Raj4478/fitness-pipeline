name: Daily FitFacts Video Generator

on:
  schedule:
    # 9 AM IST = 3:30 AM UTC
    - cron: '30 3 * * *'
    # 1 PM IST = 7:30 AM UTC
    - cron: '30 7 * * *'
    # 7 PM IST = 1:30 PM UTC
    - cron: '30 13 * * *'
  workflow_dispatch:  # manual trigger from GitHub UI anytime

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install httpx tenacity pydantic pydantic-settings \
            python-dotenv requests cloudinary imageio-ffmpeg \
            Pillow python-telegram-bot==21.6

      - name: Create required folders
        run: mkdir -p logs tmp/videos tmp/audio assets music

      - name: Copy logo to assets
        run: |
          if [ -f "assets/logo.png" ]; then
            echo "Logo found"
          else
            echo "No logo found — skipping"
          fi

      - name: Generate video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: eleven_flash_v2_5
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
        run: python -m src.pipeline --niche fitness --dry-run

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: eleven_flash_v2_5
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/send_to_telegram.py

      - name: Upload video as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: fitfacts-video-${{ github.run_number }}
          path: tmp/videos/*.mp4
          retention-days: 7
