name: Authorized Media Download Worker

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Authorized public YouTube or Instagram Reel URL to download'
        required: true
        type: string
      chat_id:
        description: 'Telegram chat that requested the download'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: authorized-media-download-${{ inputs.chat_id }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MEDIA_URL: ${{ inputs.url }}
      TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      DOWNLOAD_MAX_DURATION_SECONDS: '900'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install downloader runtime
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check -U --pre "yt-dlp[default]" requests
      - name: Download and return video to Telegram
        run: python youtube-telegram-bot/scripts/download_youtube.py
