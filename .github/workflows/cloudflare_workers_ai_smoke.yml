name: Cloudflare Workers AI Smoke

on:
  push:
    branches:
      - test/cloudflare-workers-ai
    paths:
      - '.github/workflows/cloudflare_workers_ai_smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify secrets are present
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "Cloudflare credentials are present"

      - name: Verify configured account ID matches Workers AI page
        env:
          EXPECTED_CLOUDFLARE_ACCOUNT_ID: 0f27f8736524320f3f80b93b3d485f98
        run: |
          if [ "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Configured account ID matches the Workers AI dashboard account ✅"
          else
            echo "Configured account ID DOES NOT match the Workers AI dashboard account ❌"
            exit 1
          fi

      - name: Verify Cloudflare API token status
        run: |
          verify_code="$(curl -sS -o token.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          echo "Token verify HTTP status: $verify_code"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("token.json").read_text())
          print("Token success:", payload.get("success"))
          print("Token status:", (payload.get("result") or {}).get("status"))
          print("Errors:", payload.get("errors") or [])
          PY

      - name: Verify token against configured account
        run: |
          account_code="$(curl -sS -o account-token.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          echo "Account token verify HTTP status: $account_code"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("account-token.json").read_text())
          print("Account-token success:", payload.get("success"))
          print("Account-token status:", (payload.get("result") or {}).get("status"))
          print("Account-token errors:", payload.get("errors") or [])
          PY

      - name: Test exact Cloudflare Workers AI quick-start endpoint
        run: |
          quick_code="$(curl -sS -o quick.json -w '%{http_code}' \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/meta/llama-3.1-8b-instruct" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "cf-aig-gateway-id: default" \
            --header "Content-Type: application/json" \
            --data '{"prompt":"Reply with only OK"}')"
          echo "Quick-start inference HTTP status: $quick_code"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("quick.json").read_text())
          print("Quick-start success:", payload.get("success"))
          print("Quick-start errors:", payload.get("errors") or [])
          if payload.get("success"):
              print("Quick-start result present:", bool(payload.get("result")))
          PY

      - name: Generate test image with Workers AI
        run: |
          http_code="$(curl -sS -o response.json -w '%{http_code}' \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-2-klein-4b" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "cf-aig-gateway-id: default" \
            --form "prompt=A serene golden sunrise over Himalayan mountains, cinematic, no text" \
            --form "width=512" \
            --form "height=512")"

          echo "HTTP status: $http_code"
          python - <<'PY'
          import base64, json
          from pathlib import Path

          payload = json.loads(Path("response.json").read_text())
          if not payload.get("success"):
              raise SystemExit("Cloudflare API failed: " + json.dumps(payload.get("errors") or payload, ensure_ascii=False)[:1000])

          result = payload.get("result") or {}
          image = result.get("image")
          if not image:
              raise SystemExit("Cloudflare response did not contain result.image")

          raw = base64.b64decode(image)
          if len(raw) < 1000:
              raise SystemExit(f"Generated image payload too small: {len(raw)} bytes")

          Path("cloudflare-smoke.png").write_bytes(raw)
          print(f"Workers AI image generation succeeded: {len(raw)} bytes")
          PY
          test "$http_code" = "200"
