name: Telegram Media Bot CI

on:
  push:
    branches:
      - master
      - feature/instagram-reel-telegram-downloader
    paths:
      - 'youtube-telegram-bot/**'
      - '.github/workflows/youtube_download_worker.yml'
      - '.github/workflows/telegram_media_ci.yml'
  pull_request:
    paths:
      - 'youtube-telegram-bot/**'
      - '.github/workflows/youtube_download_worker.yml'
      - '.github/workflows/telegram_media_ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Telegram bot unit tests
        working-directory: youtube-telegram-bot
        run: npm test
      - name: Validate media worker sources
        run: |
          python -m py_compile youtube-telegram-bot/scripts/download_youtube.py
          python -m py_compile youtube-telegram-bot/scripts/transform_reel.py
      - name: Verify Krishna intro asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          assets = Path("youtube-telegram-bot/assets")
          parts = [
              assets / "krishna-intro.00a.b64",
              assets / "krishna-intro.00b.b64",
              *[assets / f"krishna-intro.chunk{i:02d}.b64" for i in range(1, 9)],
              assets / "krishna-intro.09a.b64",
              assets / "krishna-intro.09b.b64",
          ]
          encoded = "".join(path.read_text(encoding="ascii").strip() for path in parts)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          assert len(payload) == 41610, len(payload)
          assert digest == "2e4b59b4afb465314e510707faa0e96de46641cbb67b4b12990ffb3c4eb66c73", digest
          assert payload.startswith(b"\xff\xd8") and payload.endswith(b"\xff\xd9")
          print("Krishna intro asset verified:", len(payload), digest)
          PY
      - name: Install renderer smoke dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install --disable-pip-version-check -q yt-dlp requests
      - name: Verify editorial API failure fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          scripts = Path("youtube-telegram-bot/scripts").resolve()
          sys.path.insert(0, str(scripts))
          import transform_reel

          class RefusedResponse:
              ok = False
              status_code = 400
              text = '{"error":{"code":"json_validate_failed","failed_generation":"refused"}}'

          original_post = transform_reel.requests.post
          transform_reel.requests.post = lambda *args, **kwargs: RefusedResponse()
          try:
              editorial = transform_reel.make_editorial(
                  "जब चिंता बढ़ती है तब मन भगवान के स्मरण में लगाना चाहिए और धैर्य रखना चाहिए।",
                  "test clip",
                  "https://www.instagram.com/reel/test/",
                  "fake-key",
              )
          finally:
              transform_reel.requests.post = original_post

          assert editorial["hook"] == "चिंता के समय मन को कैसे संभालें?", editorial
          assert editorial["caption"], editorial
          assert editorial["takeaway"], editorial
          assert editorial["hashtags"][0] == "#PremanandJiMaharaj", editorial
          print("Editorial refusal fallback verified:", editorial["hook"])
          PY
      - name: Smoke test premium Reel renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          scripts = Path("youtube-telegram-bot/scripts").resolve()
          sys.path.insert(0, str(scripts))
          from transform_reel import render

          with tempfile.TemporaryDirectory(prefix="reel-smoke-") as temp:
              directory = Path(temp)
              source = directory / "source.mp4"
              subprocess.run(
                  [
                      "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                      "-f", "lavfi", "-i", "color=c=0x243044:s=720x1280:d=4:r=30",
                      "-f", "lavfi", "-i", "sine=frequency=440:duration=4:sample_rate=44100",
                      "-shortest",
                      "-c:v", "libx264", "-pix_fmt", "yuv420p",
                      "-c:a", "aac", "-ar", "44100", "-ac", "2",
                      str(source),
                  ],
                  check=True,
              )
              result = render(
                  source,
                  [{"start": 0.2, "end": 1.5, "text": "मन को शांति कैसे मिले?"}],
                  {
                      "hook": "मन को शांत कैसे रखा जाए?",
                      "takeaway": "सीख: परिस्थिति कठिन हो, फिर भी मन को भगवान में स्थिर रखने का अभ्यास करें।",
                  },
                  directory,
              )
              output = Path(result)
              assert output.is_file() and output.stat().st_size > 10000
              probe = subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-select_streams", "v:0",
                      "-show_entries", "stream=width,height",
                      "-of", "csv=p=0:s=x",
                      str(output),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()
              assert probe == "720x1280", probe
              print("Premium Reel render verified:", output.stat().st_size, probe)
          PY
