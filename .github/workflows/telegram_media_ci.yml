name: Telegram Media Bot CI

on:
  push:
    branches:
      - master
      - feature/instagram-reel-telegram-downloader
    paths:
      - 'youtube-telegram-bot/**'
      - '.github/workflows/youtube_download_worker.yml'
      - '.github/workflows/original_reel_worker.yml'
      - '.github/workflows/daily_reel_recommendation.yml'
      - '.github/workflows/telegram_media_ci.yml'
  pull_request:
    paths:
      - 'youtube-telegram-bot/**'
      - '.github/workflows/youtube_download_worker.yml'
      - '.github/workflows/original_reel_worker.yml'
      - '.github/workflows/daily_reel_recommendation.yml'
      - '.github/workflows/telegram_media_ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Telegram bot unit tests
        working-directory: youtube-telegram-bot
        run: npm test
      - name: Validate media worker sources
        run: |
          node --check youtube-telegram-bot/scripts/send-daily-recommendation.mjs
          python -m py_compile youtube-telegram-bot/scripts/download_youtube.py
          python -m py_compile youtube-telegram-bot/scripts/transform_reel.py
          python -m py_compile youtube-telegram-bot/scripts/create_original_reel.py
          ! grep -q "zoompan=" youtube-telegram-bot/scripts/create_original_reel.py
          ! grep -q "vignette=" youtube-telegram-bot/scripts/create_original_reel.py
      - name: Verify Krishna intro asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          assets = Path("youtube-telegram-bot/assets")
          parts = [
              assets / "krishna-intro.00a.b64",
              assets / "krishna-intro.00b.b64",
              *[assets / f"krishna-intro.chunk{i:02d}.b64" for i in range(1, 9)],
              assets / "krishna-intro.09a.b64",
              assets / "krishna-intro.09b.b64",
          ]
          encoded = "".join(path.read_text(encoding="ascii").strip() for path in parts)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          assert len(payload) == 41610, len(payload)
          assert digest == "2e4b59b4afb465314e510707faa0e96de46641cbb67b4b12990ffb3c4eb66c73", digest
          assert payload.startswith(b"\xff\xd8") and payload.endswith(b"\xff\xd9")
          print("Krishna intro asset verified:", len(payload), digest)
          PY
      - name: Install renderer smoke dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install --disable-pip-version-check -q yt-dlp requests pillow
      - name: Verify generated five-scene story frames
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import sys
          import tempfile
          from PIL import Image

          scripts = Path("youtube-telegram-bot/scripts").resolve()
          sys.path.insert(0, str(scripts))
          import create_original_reel as reel

          with tempfile.TemporaryDirectory(prefix="story-scenes-") as temp:
              scenes = reel.generate_fallback_story_scenes(Path(temp), "peaceful")
              assert len(scenes) == 5, scenes
              hashes = []
              for scene in scenes:
                  assert scene.is_file() and scene.stat().st_size > 20000, (scene, scene.stat().st_size)
                  with Image.open(scene) as image:
                      assert image.size == (1080, 1920), (scene, image.size)
                      assert image.format == "JPEG", (scene, image.format)
                  hashes.append(hashlib.sha256(scene.read_bytes()).hexdigest())
              assert len(set(hashes)) == 5, hashes
              print("Five generated story scenes verified:", ", ".join(path.name for path in scenes))
          PY

      - name: Verify Cloudflare FLUX story image adapter
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import io
          import sys
          import tempfile
          from PIL import Image

          scripts = Path("youtube-telegram-bot/scripts").resolve()
          sys.path.insert(0, str(scripts))
          import create_original_reel as reel

          def encoded_image(index):
              source = Image.new(
                  "RGB",
                  (1080, 1920),
                  (35 + index * 20, 65 + index * 14, 100 + index * 11),
              )
              buf = io.BytesIO()
              source.save(buf, format="JPEG", quality=94)
              return base64.b64encode(buf.getvalue()).decode("ascii")

          calls = []

          class FakeResponse:
              ok = True
              status_code = 200
              text = ""
              def __init__(self, index):
                  self.index = index
              def json(self):
                  return {
                      "success": True,
                      "errors": [],
                      "result": {"image": encoded_image(self.index)},
                  }

          def fake_post(url, **kwargs):
              calls.append({"url": url, "files": kwargs.get("files", {})})
              return FakeResponse(len(calls))

          original_post = reel.requests.post
          reel.requests.post = fake_post
          try:
              with tempfile.TemporaryDirectory(prefix="cloudflare-story-scenes-") as temp:
                  scenes, mode = reel.generate_cloudflare_story_scenes(
                      Path(temp),
                      "overthinking at night",
                      "peaceful",
                      "account-id",
                      "api-token",
                  )
                  assert len(scenes) == 5, scenes
                  assert len(calls) == 5, calls
                  assert mode == "cloudflare_hybrid_9b_4b", mode
                  assert calls[0]["url"].endswith("/@cf/black-forest-labs/flux-2-klein-9b"), calls[0]["url"]
                  for call in calls[1:]:
                      assert call["url"].endswith("/@cf/black-forest-labs/flux-2-klein-4b"), call["url"]
                  for call in calls:
                      fields = call["files"]
                      assert fields["width"][1] == "1080", fields
                      assert fields["height"][1] == "1920", fields
                      assert fields["guidance"][1] == "4.0", fields
                      assert fields["prompt"][1], fields
                  assert "input_image_0" not in calls[0]["files"]
                  assert "input_image_0" not in calls[1]["files"]
                  assert "input_image_0" in calls[2]["files"]
                  assert "input_image_0" not in calls[3]["files"]
                  assert "input_image_0" in calls[4]["files"]
                  for scene in scenes:
                      with Image.open(scene) as image:
                          assert image.size == (1080, 1920), image.size
                          assert image.format == "JPEG", image.format
          finally:
              reel.requests.post = original_post

          print("Cloudflare hybrid FLUX adapter verified:", len(calls), "generation calls")
          PY

      - name: Verify Cloudflare content-filter recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import io
          import sys
          import tempfile
          from PIL import Image

          scripts = Path("youtube-telegram-bot/scripts").resolve()
          sys.path.insert(0, str(scripts))
          import create_original_reel as reel

          def image_payload(index):
              source = Image.new("RGB", (1080, 1920), (55 + index * 10, 85 + index * 9, 115 + index * 8))
              buf = io.BytesIO()
              source.save(buf, format="JPEG", quality=92)
              return base64.b64encode(buf.getvalue()).decode("ascii")

          calls = []

          class Response:
              def __init__(self, ok, index):
                  self.ok = ok
                  self.status_code = 200 if ok else 400
                  self.index = index
                  self.text = (
                      ""
                      if ok
                      else '{"errors":[{"message":"AiError: Your output has been flagged. Please choose another prompt / input image combination","code":3030}]}'
                  )
              def json(self):
                  if self.ok:
                      return {"success": True, "errors": [], "result": {"image": image_payload(self.index)}}
                  return {"success": False, "errors": [{"code": 3030, "message": "output flagged"}], "result": {}}

          flagged_once = False
          def fake_post(url, **kwargs):
              global flagged_once
              files = kwargs.get("files", {})
              calls.append({"url": url, "files": files})
              # Scene 3 normally has an input reference. Simulate Cloudflare's benign
              # content-filter false positive on that combination, then allow the
              # retry without the reference image to succeed.
              if "input_image_0" in files and not flagged_once:
                  flagged_once = True
                  return Response(False, len(calls))
              return Response(True, len(calls))

          original_post = reel.requests.post
          reel.requests.post = fake_post
          try:
              with tempfile.TemporaryDirectory(prefix="cloudflare-filter-recovery-") as temp:
                  scenes, mode = reel.generate_cloudflare_story_scenes(
                      Path(temp), "Mental peace", "peaceful", "account", "token"
                  )
                  assert len(scenes) == 5, scenes
                  assert mode == "cloudflare_hybrid_9b_4b", mode
                  assert flagged_once, "expected simulated content-filter event"
                  assert len(calls) == 6, calls
                  assert "input_image_0" in calls[2]["files"], calls[2]
                  assert "input_image_0" not in calls[3]["files"], calls[3]
          finally:
              reel.requests.post = original_post

          print("Cloudflare benign content-filter recovery verified")
          PY

      - name: Verify premium hook falls back to FLUX 4B
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import io
          import sys
          import tempfile
          from PIL import Image

          scripts = Path("youtube-telegram-bot/scripts").resolve()
          sys.path.insert(0, str(scripts))
          import create_original_reel as reel

          def image_payload(index):
              source = Image.new("RGB", (1080, 1920), (40 + index * 15, 80 + index * 10, 120 + index * 8))
              buf = io.BytesIO()
              source.save(buf, format="JPEG", quality=92)
              return base64.b64encode(buf.getvalue()).decode("ascii")

          calls = []

          class FakeResponse:
              status_code = 200
              text = ""
              def __init__(self, ok, index):
                  self.ok = ok
                  self.index = index
              def json(self):
                  if not self.ok:
                      return {"success": False, "errors": [{"code": 999, "message": "premium unavailable"}]}
                  return {"success": True, "errors": [], "result": {"image": image_payload(self.index)}}

          def fake_post(url, **kwargs):
              calls.append(url)
              if len(calls) == 1 and url.endswith("flux-2-klein-9b"):
                  response = FakeResponse(False, 0)
                  response.status_code = 429
                  response.text = '{"errors":[{"message":"quota"}]}'
                  return response
              return FakeResponse(True, len(calls))

          original_post = reel.requests.post
          reel.requests.post = fake_post
          try:
              with tempfile.TemporaryDirectory(prefix="cloudflare-premium-fallback-") as temp:
                  scenes, mode = reel.generate_cloudflare_story_scenes(
                      Path(temp), "overthinking", "peaceful", "account", "token"
                  )
                  assert len(scenes) == 5
                  assert mode == "cloudflare_4b", mode
                  assert calls[0].endswith("flux-2-klein-9b"), calls
                  assert calls[1].endswith("flux-2-klein-4b"), calls
                  assert len(calls) == 6, calls
          finally:
              reel.requests.post = original_post

          print("Premium hook 9B -> 4B fallback verified")
          PY

      - name: Verify production image generation fails closed
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import sys
          import tempfile

          scripts = Path("youtube-telegram-bot/scripts").resolve()
          sys.path.insert(0, str(scripts))
          import create_original_reel as reel

          original_dry = os.environ.pop("ORIGINAL_REEL_DRY_RUN", None)
          original_cloudflare = reel.generate_cloudflare_story_scenes
          reel.generate_cloudflare_story_scenes = lambda *args, **kwargs: (_ for _ in ()).throw(RuntimeError("cloudflare_down"))
          try:
              with tempfile.TemporaryDirectory(prefix="provider-fail-closed-") as temp:
                  try:
                      reel.build_story_scenes(Path(temp), "overthinking", "peaceful", "account", "token")
                      raise AssertionError("expected high-quality provider failure")
                  except RuntimeError as exc:
                      message = str(exc)
                      assert "refusing local low-quality fallback" in message, message
                      assert "Cloudflare Workers AI failed" in message, message
          finally:
              reel.generate_cloudflare_story_scenes = original_cloudflare
              if original_dry is not None:
                  os.environ["ORIGINAL_REEL_DRY_RUN"] = original_dry

          print("Production image generation correctly refuses low-quality fallback")
          PY
      - name: Verify editorial API failure fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          scripts = Path("youtube-telegram-bot/scripts").resolve()
          sys.path.insert(0, str(scripts))
          import transform_reel

          class RefusedResponse:
              ok = False
              status_code = 400
              text = '{"error":{"code":"json_validate_failed","failed_generation":"refused"}}'

          original_post = transform_reel.requests.post
          transform_reel.requests.post = lambda *args, **kwargs: RefusedResponse()
          try:
              editorial = transform_reel.make_editorial(
                  "जब चिंता बढ़ती है तब मन भगवान के स्मरण में लगाना चाहिए और धैर्य रखना चाहिए।",
                  "test clip",
                  "https://www.instagram.com/reel/test/",
                  "fake-key",
              )
          finally:
              transform_reel.requests.post = original_post

          assert editorial["hook"] == "चिंता के समय मन को कैसे संभालें?", editorial
          assert editorial["caption"], editorial
          assert editorial["takeaway"], editorial
          assert editorial["hashtags"][0] == "#PremanandJiMaharaj", editorial
          print("Editorial refusal fallback verified:", editorial["hook"])
          PY
      - name: Smoke test premium Reel renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          scripts = Path("youtube-telegram-bot/scripts").resolve()
          sys.path.insert(0, str(scripts))
          from transform_reel import render

          with tempfile.TemporaryDirectory(prefix="reel-smoke-") as temp:
              directory = Path(temp)
              source = directory / "source.mp4"
              subprocess.run(
                  [
                      "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                      "-f", "lavfi", "-i", "color=c=0x243044:s=720x1280:d=4:r=30",
                      "-f", "lavfi", "-i", "sine=frequency=440:duration=4:sample_rate=44100",
                      "-shortest",
                      "-c:v", "libx264", "-pix_fmt", "yuv420p",
                      "-c:a", "aac", "-ar", "44100", "-ac", "2",
                      str(source),
                  ],
                  check=True,
              )
              result = render(
                  source,
                  [{"start": 0.2, "end": 1.5, "text": "मन को शांति कैसे मिले?"}],
                  {
                      "hook": "मन को शांत कैसे रखा जाए?",
                      "takeaway": "सीख: परिस्थिति कठिन हो, फिर भी मन को भगवान में स्थिर रखने का अभ्यास करें।",
                  },
                  directory,
              )
              output = Path(result)
              assert output.is_file() and output.stat().st_size > 10000
              probe = subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-select_streams", "v:0",
                      "-show_entries", "stream=width,height",
                      "-of", "csv=p=0:s=x",
                      str(output),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()
              assert probe == "720x1280", probe
              print("Premium Reel render verified:", output.stat().st_size, probe)
          PY

      - name: Smoke test original mood Reel generator
        env:
          ORIGINAL_REEL_MOOD: peaceful
          ORIGINAL_REEL_TOPIC: overthinking at night
          ORIGINAL_REEL_DRY_RUN: '1'
          ORIGINAL_REEL_SKIP_TELEGRAM: '1'
          ORIGINAL_REEL_OUTPUT_DIR: ${{ runner.temp }}/original-reel-smoke
        run: |
          result="$(python youtube-telegram-bot/scripts/create_original_reel.py)"
          echo "$result"
          echo "$result" | grep -q '"story_scenes": 5'
          echo "$result" | grep -q '"image_mode": "local_fallback"'
          echo "$result" | grep -q '"tts": false'
          echo "$result" | grep -q '"voice": false'
          ! grep -q "edge_tts" youtube-telegram-bot/scripts/create_original_reel.py
          ! grep -q "narration.mp3" youtube-telegram-bot/scripts/create_original_reel.py
          test -s "${ORIGINAL_REEL_OUTPUT_DIR}/original-devotional-reel.mp4"
          dims="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "${ORIGINAL_REEL_OUTPUT_DIR}/original-devotional-reel.mp4")"
          test "$dims" = "1080x1920"
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "${ORIGINAL_REEL_OUTPUT_DIR}/original-devotional-reel.mp4")"
          python - <<PY
          duration = float("$duration")
          assert 18.8 <= duration <= 19.6, duration
          print("Original mood Reel render verified:", duration, "seconds", "$dims")
          PY
          python - <<'PY'
          from pathlib import Path
          import audioop
          import os
          import wave

          music = Path(os.environ["ORIGINAL_REEL_OUTPUT_DIR"]) / "music.wav"
          with wave.open(str(music), "rb") as wf:
              frames = wf.readframes(wf.getnframes())
              rms = audioop.rms(frames, wf.getsampwidth()) / 32768.0
          assert rms > 0.025, rms
          print("Flute music RMS verified:", round(rms, 4))
          PY
