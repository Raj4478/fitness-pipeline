name: One-time retry failed Reel

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/retry_failed_reel.yml'

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MEDIA_URL: 'https://www.instagram.com/reel/DaHkXpLJQlC/'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DOWNLOAD_MAX_DURATION_SECONDS: '900'
      TRANSFORM_MAX_DURATION_SECONDS: '180'
      GROQ_TRANSCRIBE_MODEL: 'whisper-large-v3-turbo'
      GROQ_EDITOR_MODEL: 'openai/gpt-oss-20b'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media runtime
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --disable-pip-version-check -U --pre "yt-dlp[default]" requests
      - name: Retry exact failed Reel
        run: python youtube-telegram-bot/scripts/transform_reel.py
