name: Existing Credentials Healthcheck Once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/credential_healthcheck_once.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - name: Validate required secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_ALLOWED_USER_ID"
          test -n "$GROQ_API_KEY"
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_REFRESH_TOKEN"
          echo 'Required secret names are populated.'

      - name: Validate Telegram bot credential
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/telegram.json -w '%{http_code}' "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe")
          test "$code" = '200'
          python - <<'PY'
          import json
          data=json.load(open('/tmp/telegram.json'))
          assert data.get('ok') is True
          print('Telegram credential valid.')
          PY

      - name: Validate Groq credential
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/groq.json -w '%{http_code}' -H "Authorization: Bearer ${GROQ_API_KEY}" https://api.groq.com/openai/v1/models)
          test "$code" = '200'
          python - <<'PY'
          import json
          data=json.load(open('/tmp/groq.json'))
          assert isinstance(data.get('data'), list)
          print('Groq credential valid.')
          PY

      - name: Validate YouTube OAuth refresh credential
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --data-urlencode "client_id=${YOUTUBE_CLIENT_ID}"
            --data-urlencode "refresh_token=${YOUTUBE_REFRESH_TOKEN}"
            --data-urlencode 'grant_type=refresh_token'
          )
          if [ -n "${YOUTUBE_CLIENT_SECRET:-}" ]; then
            args+=(--data-urlencode "client_secret=${YOUTUBE_CLIENT_SECRET}")
          fi
          code=$(curl -sS -o /tmp/google-token.json -w '%{http_code}' -X POST "${args[@]}" https://oauth2.googleapis.com/token)
          test "$code" = '200'
          access_token=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/google-token.json'))
          token=data.get('access_token','')
          assert token
          print(token)
          PY
          )
          code=$(curl -sS -o /tmp/youtube.json -w '%{http_code}' -H "Authorization: Bearer ${access_token}" 'https://www.googleapis.com/youtube/v3/videos?part=id&id=dQw4w9WgXcQ')
          test "$code" = '200'
          echo 'YouTube OAuth credential valid.'
