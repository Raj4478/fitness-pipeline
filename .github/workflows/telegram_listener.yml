name: Telegram Bot Listener

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Poll Telegram & handle commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
          GH_ACTIONS_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
        run: python scripts/telegram_webhook.py

      - name: Save offset back to repo
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .telegram_offset 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update telegram offset [skip ci]"
          git push || true
