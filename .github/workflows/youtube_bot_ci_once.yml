name: YouTube Telegram Bot Credential-Reuse CI

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/youtube_bot_ci_once.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
